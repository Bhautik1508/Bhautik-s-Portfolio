<!--
  Source for og-image.png (the file the meta tags actually reference).
  Regenerate with: scripts/build-og-image.sh
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Cream ground -->
  <rect width="1200" height="630" fill="#F5F0EB"/>

  <!-- Sage rules, top and bottom -->
  <rect x="0" y="0" width="1200" height="10" fill="#3B6B4F"/>
  <rect x="0" y="620" width="1200" height="10" fill="#3B6B4F"/>

  <!-- Name -->
  <text x="600" y="272" text-anchor="middle"
        font-family="'DM Sans', system-ui, sans-serif" font-size="92" fill="#1A1A1A">
    Bhautik Patel.
  </text>

  <!-- Role line -->
  <text x="600" y="330" text-anchor="middle"
        font-family="'DM Sans', system-ui, sans-serif" font-size="34" fill="#3B6B4F">
    Product Manager · AI × Fintech
  </text>

  <!-- Divider -->
  <line x1="570" y1="371" x2="630" y2="371" stroke="#DDD8D2" stroke-width="2"/>

  <!-- Credentials -->
  <text x="600" y="431" text-anchor="middle"
        font-family="'DM Sans', system-ui, sans-serif" font-size="22" fill="#6B6560">
    Brillio · IIT Delhi MBA · 5+ yrs AI × fintech
  </text>
</svg>
